name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Copy Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Add Android Camera & Media Permissions to Manifest
        run: |
          sed -i '/<manifest xmlns:android/a \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' android/app/src/main/AndroidManifest.xml

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.11
          name: "EasyPay Android APK v1.0.11 (Full Live QR Camera Scanner, Amount QR Generator, EasyPay Mall & Gift Cards Fix)"
          body: |
            ## EasyPay Mobile Application APK v1.0.11 (Master Release)
            Complete resolution of all user requested issues:
            
            ### Fixes & Enhancements in v1.0.11:
            1. **My QR Code Screen**:
               - Completely removed "Bank of India" pill text.
               - Added "Generate QR with Amount" feature with quick amount chips (+₹100, +₹500, +₹1,000, +₹2,000) that generates dynamic QR with requested amount and visual badge.
            2. **Scan EasyPay / UPI QR Code**:
               - Integrated real-time camera viewfinder with jsQR automatic detection.
               - Detects EasyPay QR codes and standard UPI IDs (e.g. `upi://pay?pa=...`), automatically pre-filling recipient & amount into the PhonePe/GPay send money flow.
               - Clean, polished bottom sheet with Gallery upload button, manual UPI ID option, and neon laser scanning guide.
            3. **Eliminated "OR TAP A VERIFIED PEER USER"**:
               - Completely removed from all pages across the application.
            4. **Gift Cards Catalog & Purchase Alignment**:
               - Fixed `.gift-purchase-page` CSS and spacing so the entire page is perfectly centered without shifting to the right or over-stretching.
               - Populated full 32-brand catalog with Top Brands and New Arrivals static pre-rendering.
            5. **EasyPay Mall / Shopping Section**:
               - Restored full e-commerce storefront with 8+ verified products across Audio, Smartwatches, Electronics, Fashion.
               - Added functional "Add to Cart" and Cart Bottom-Sheet with live item counter, quantities, and wallet checkout flow.
            6. **Home Page Quick Services & UPI**:
               - Restored all 8 recharge & bill payment touchables (Mobile, Postpaid, Electricity, FASTag, DTH, Gas, Broadband, Credit Card).
               - Restored "Pay via UPI ID" and "Pay ID / Mobile" leading directly to verified recipient transfer flow.
            7. **Strict 5-Tab Isolated Bottom Navigation**:
               - Home | Gift | Invest (12% Bonds) | Shopping | Profile.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
