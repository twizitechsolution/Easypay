name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Sync Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Add Android Camera & Media Permissions to Manifest
        run: |
          sed -i '/<manifest xmlns:android/a \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' android/app/src/main/AndroidManifest.xml

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-v1.0.21.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.21
          name: "EasyPay Android APK v1.0.21 (Live DLT-Approved SMS Integration - AFTTRD)"
          body: |
            ## EasyPay Mobile Application APK v1.0.21 (Production Release)
            Direct native Android APK connected live to Vercel production server: https://easypay-gamma.vercel.app

            ### Key Features & Updates in v1.0.21:
            1. **Live DLT-Approved SMS Gateway Integration (Sender: AFTTRD)**:
               - Updated HSPSMS configuration with approved DLT Entity Header: `AFTTRD`.
               - Approved Template: `Your Aftertrade OTP is {#var#}. Valid 5 min. Do not share. -AfterTrade`.
               - Verified real-time SMS delivery to physical handset (Gateway Status: `Message SuccessFully Submitted`).
            2. **Clean Trip Announcement Pop-up (No Phone Bezels)**:
               - High-resolution cropped flyer for Kumbhalgarh, Goa & Thailand trips with floating ✕ close button.
            3. **Resilient OTP Verification & 1-Tap Auto-Fill**:
               - Auto-populates 4 digit OTP and activates the Verify button immediately.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
