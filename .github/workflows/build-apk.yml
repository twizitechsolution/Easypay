name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Sync Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Add Android Camera & Media Permissions to Manifest
        run: |
          sed -i '/<manifest xmlns:android/a \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' android/app/src/main/AndroidManifest.xml

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-v1.0.30.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.30
          name: "EasyPay Android APK v1.0.30 (Mobile Responsive Checkout, Bulk Orders, E-Pay Wallet, Amount Prompt First, PIN Protected Balance, Bank/UPI/USDT Details)"
          body: |
            ## EasyPay Mobile Application APK v1.0.30 (Production Release)
            Direct native Android APK connected live to Vercel production server: https://easypay-gamma.vercel.app

            ### Key Enhancements & Fixes in v1.0.30:
            1. **Dedicated Checkout Mobile Responsiveness**:
               - Fully centered and constrained (`max-width: 480px; width: 100%`) with fluid responsive layout.
               - Top sticky bar and bottom "Pay & Place Order" sticky bar aligned and mobile optimized with zero edge clipping.
            2. **My Orders Bulk Order Display & Expansion**:
               - Orders containing multiple products display a "+X more item(s)" interactive toggle button.
               - Clicking reveals all products within that order (thumbnails, titles, quantities, unit prices).
            3. **Unified "E-Pay Wallet" Branding**:
               - All wallet debit labels, payment success modals, and checkout headers now strictly display "E-Pay Wallet".
            4. **Account & Wallet Balance PIN Protection**:
               - Wallet balance is masked by default (`₹ • • • • • •`).
               - Users tap "View" to open a dedicated 4-digit Security PIN verification modal, unmasking the balance only after authentication.
               - Removed unused State Bank of India entry from balance modal.
            5. **Enter Amount Prompt First Flow**:
               - Clicking "Pay" next to any contact, Twizitech, Rahul Sharma, or "To Bank/Self" now prompts the user to enter the amount first.
               - Clean input field with prominent currency symbol (`₹`), quick amount chips (+₹100, +₹200, +₹500, +₹1,000), optional note, and balance indicator.
               - Routes to Payment Source sheet with exact entered amount.
            6. **Transactions Ledger FontAwesome Icons**:
               - Replaced missing icons with standard FontAwesome icons: green downward arrow (`fa-arrow-down`) for credited payments and red upward arrow (`fa-arrow-up`) for debited payments.
            7. **Passbook Dedicated Sub-Page Navigation**:
               - Added top sticky header with `<` back button returning to Profile.
               - Bottom navigation bar is hidden while on Passbook and sub-pages to eliminate user confusion, restoring automatically on exit.
            8. **Update Payment Details (Bank Account, UPI ID, USDT Crypto)**:
               - Redesigned "Update Payment Details" view with "+ Add" action.
               - Multi-channel modal with dropdown selector for Bank Account, UPI ID, and USDT Crypto (TRC-20, BEP-20, ERC-20).
               - Real-time persistence via backend `/api/user/payment-details`.
            9. **Profile Page Streamlining**:
               - Removed inactive Wallet section from Profile menu group 2.
            10. **Visual Assets & Gift Cards Refresh**:
               - Removed "Pay Bills" badge from Recharges section.
               - Sourced local vector SVG brand assets in `public/assets/brands/` (Apple, Domino's, Amazon, Myntra, Amazon Prime, Smart Bazaar, BGMI, Decathlon) avoiding external HTTP 429 rate limits.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
