name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Sync Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Add Android Camera & Media Permissions to Manifest
        run: |
          sed -i '/<manifest xmlns:android/a \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' android/app/src/main/AndroidManifest.xml

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-v1.0.24.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.24
          name: "EasyPay Android APK v1.0.24 (Dynamic Payment Modals, Session Persistence & Strict Registration Flow)"
          body: |
            ## EasyPay Mobile Application APK v1.0.24 (Production Release)
            Direct native Android APK connected live to Vercel production server: https://easypay-gamma.vercel.app

            ### Key Features & Updates in v1.0.24:
            1. **100% Dynamic Payment Success Modal**:
               - Exact dynamic amount paid (e.g. ₹150.00, ₹96.00). No hardcoded ₹280.00.
               - Dynamic recipient and purpose (e.g. "Paid for Uber Rides Gift Voucher", "Paid for Mobile Recharge", "Paid to Rahul Sharma").
               - Dynamic unique UTR reference generated for each transaction.
               - Dynamic current Indian timestamp and masked debited wallet.
               - Instant Voucher Card reveal for gift cards with 16-digit code, PIN, and 1-tap Copy.
            2. **Permanent Session Persistence in APK & Web**:
               - Stores authenticated user session in localStorage.
               - Closing and re-opening the APK keeps the user permanently logged in until explicitly tapping "Log Out".
            3. **Strict Registration & Sign Up Flow**:
               - Login is strictly restricted to registered users only.
               - Unregistered mobile numbers receive an interactive "Registration Required" prompt directing them to Sign Up with mobile pre-filled.
               - Pre-seeded Arman Khan (`7013893165`) and full user registration storage with ₹100 welcome bonus.
            4. **Hubble Money 380+ Gift Cards Catalog**:
               - All 387 Hubble active brands and CDN logos visible with crisp white card containers and fallback initials.
               - Category filters for Food, Shopping, Fashion, Grocery, Health, Electronics, OTT, Travel, Gaming, and Jewellery.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
