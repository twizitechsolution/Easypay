name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Copy Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Add Android Camera & Media Permissions to Manifest
        run: |
          sed -i '/<manifest xmlns:android/a \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' android/app/src/main/AndroidManifest.xml

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.14
          name: "EasyPay Android APK v1.0.14 (Full E-Commerce Flow, Animated Success Screen & Navigation Fixes)"
          body: |
            ## EasyPay Mobile Application APK v1.0.14 (Production Release)
            Comprehensive bug fixes, user flow enhancements, and e-commerce platform implementation:

            ### Fixes & Enhancements in v1.0.14:
            1. **Sub-View Isolation & Navigation Fix**:
               - Converted Pay Anyone, Bank Accounts, and Refer & Earn to fixed full-screen overlay views (`position: fixed; inset: 0; z-index: 9999`) so they never render beneath other pages.
               - `switchNavTab` explicitly hides all sub-views on tab switch.
               - Removed home header on Pay Anyone view for a clean native screen.
               - Search input on Pay Anyone is blank by default with clean search filtering.
            2. **Payment Source Sheet (`Pay ₹... from`)**:
               - Consolidated payment source to a single clean EasyPay Wallet option with wallet icon, user's UPI ID (`····8808@easypay`), inline "Check Balance", and active checkmark.
               - Removed unused bank options.
            3. **Animated Payment Success Screen Resolution**:
               - Removed duplicate PIN handler that prematurely closed the modal.
               - PIN completion now smoothly transitions inline to the green animated success screen with amount, recipient, UTR, timestamp, audio chime, Done, and Share Receipt.
            4. **Complete E-Commerce Flow & Product Details**:
               - Removed 'Buy' button from shopping catalog cards; only 'Add to Cart' remains.
               - Clicking product card opens full-screen Product Details page with specifications, warranty, reviews, and bottom action bar (Add to Cart & Buy Now).
               - Shopping Cart modal with item counter, quantity stepper (+/-), delivery address, bill breakdown, and checkout.
            5. **Recharge & Bill Payments Operational**:
               - Fixed input element ID crash in `openRechargeModal`.
               - Implemented `executeRechargeViaPin()` seamlessly routing recharge flow through payment source and PIN verification.
               - EasyPay Mall with products and active shopping cart.
               - All 8 recharges and UPI payment touchables operational.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
