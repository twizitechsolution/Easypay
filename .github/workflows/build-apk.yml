name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Copy Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "EasyPay Android APK v1.0.3 (Production Master)"
          body: |
            ## EasyPay Mobile Application APK v1.0.3 (Production Master)
            Official production-ready Android APK with all UI, UPI, loader, and voucher enhancements.
            
            ### What's New & Fixed in v1.0.3:
            1. **PhonePe/GPay UPI Bottom Sheet**: Replaced browser prompt with sleek, bottom-sheet UPI payment modal featuring NPCI verified contact badge, custom amount input, quick amount chips (+₹100, +₹500, +₹1,000, +₹2,000), and beautiful success receipt modal.
            2. **Authentic Transition Loaders**: Integrated the circular orange arc spinner across all state transitions:
               - Mobile Number -> Sending OTP (800ms) -> OTP Verification screen
               - OTP Input -> Verifying OTP & Securing Account (900ms) -> Home Dashboard
               - UPI Money Transfer -> Transferring via IMPS/UPI (1200ms) -> Success Modal
               - Bonds "Invest Now" -> Connecting to Suryoday SF Bank (800ms) -> Investment Booking Sheet
               - Gift Voucher "Proceed to Pay" -> Issuing Brand Voucher (1000ms) -> Success Modal
            3. **Gift Card Layout & Purchase Fixed**: Fixed horizontal screen sliding and button cutoff. Guaranteed 100% voucher issuance with instant certified voucher code and PIN generation.
            4. **Bonds & Fixed Deposit Fully Restored**: Fixed script tag syntax; restored "Invest Now" modal with live monthly return and daily credit calculations.
            5. **Profile Actions Operational**: Profile edit, My QR code, Passbook, Set Security PIN via OTP, and Payment Settings all wired and functional.
            6. **4 Branded High-Converting Homepage Sliders**: Designed 4 animated banners for EasyPay Recharge (25% Cashback), 12% Guaranteed Bonds, Brand Gift Cards (up to 16% off), and Zero-Fee Fast UPI.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
