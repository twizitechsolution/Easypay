name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Sync Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Add Android Camera & Media Permissions to Manifest
        run: |
          sed -i '/<manifest xmlns:android/a \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' android/app/src/main/AndroidManifest.xml

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-v1.0.20.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.20
          name: "EasyPay Android APK v1.0.20 (Clean Flyer Pop-up, Dynamic OTP Auto-Fill & Admin DLT Manager)"
          body: |
            ## EasyPay Mobile Application APK v1.0.20 (Production Release)
            Direct native Android APK connected live to Vercel production server: https://easypay-gamma.vercel.app

            ### Key Features & Updates in v1.0.20:
            1. **Clean Announcement Pop-up (No Phone Bezels)**:
               - The announcement modal now uses the clean, cropped promotional flyer for Kumbhalgarh, Goa & Thailand trips (`/images/home_announcement.jpg`).
               - Sleek floating circular close button (✕) positioned cleanly at the top-right corner.
               - Smooth tap-to-dismiss via close button and backdrop click.
            2. **OTP Delivery Resilience & Instant 1-Tap Auto-Fill**:
               - Added prominent Verification Code banner right on the OTP screen with a 1-tap Auto-Fill button.
               - Automatically auto-fills the 4 OTP boxes after 350ms so user testing is never blocked even if telecom SMS is delayed or rejected due to DLT sender approval (`Sender Name Invalid` for placeholder `XYZ`).
               - Live status note explaining TRAI DLT Header requirements.
            3. **Enterprise Admin Announcement & SMS Manager**:
               - Fixed script loading and tab pane rendering for the Announcement & SMS tab in `/admin`.
               - Direct DLT Header configuration and Live SMS Tester with real-time response logger.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
