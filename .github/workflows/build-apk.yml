name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Sync Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Add Android Camera & Media Permissions to Manifest
        run: |
          sed -i '/<manifest xmlns:android/a \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' android/app/src/main/AndroidManifest.xml

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-v1.0.22.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.22
          name: "EasyPay Android APK v1.0.22 (Standard Clean OTP Input, No Code Leak & Strict Handset Verification)"
          body: |
            ## EasyPay Mobile Application APK v1.0.22 (Production Release)
            Direct native Android APK connected live to Vercel production server: https://easypay-gamma.vercel.app

            ### Key Features & Updates in v1.0.22:
            1. **Standard Clean OTP Screen**:
               - Completely removed on-screen verification code banner and auto-fill button.
               - Completely removed bottom DLT note badge.
               - 4 OTP input boxes start completely blank for user to manually enter the OTP received on their handset.
            2. **Strict Handset SMS Verification**:
               - Server dispatches SMS via DLT Entity Header `AFTTRD` directly to the user's mobile number.
               - OTP is never exposed in client network responses.
               - Entering incorrect OTP triggers an immediate 'Invalid OTP' notification and clears the inputs for re-entry.
            3. **Clean Trip Announcement Modal**:
               - Centered Kumbhalgarh, Goa, and Thailand flyer with top-right circular ✕ close button.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
