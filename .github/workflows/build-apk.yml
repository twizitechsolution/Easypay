name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Copy Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.10
          name: "EasyPay Android APK v1.0.10 (5-Tab Bottom Nav, Clean Header, Live Camera Scan & PIN Modal Fix)"
          body: |
            ## EasyPay Mobile Application APK v1.0.10 (Production Grade Master Release)
            Complete resolution of all UI layout anomalies, clean header without unwanted icons, exact 5-tab bottom navigation, live camera QR scanning, fixed PIN modal markup, and isolated page routing.
            
            ### Fixes & Enhancements in v1.0.10:
            1. **Authentic 5-Tab Bottom Navigation**:
               - Exact requested order: **Home | Gift | Invest (12% Bonds) | Shopping | Profile**.
               - Clicking any tab exclusively renders its dedicated page without bleed or overlap.
            2. **Clean Top Header**:
               - Left: EasyPay brand logo + "EasyPay" text (removed 3-lines menu).
               - Right: Search button + Notification bell button (removed "NB" label).
            3. **Title Updated**: Renamed "UPI Money Transfer" to "Money Transfer".
            4. **Security PIN Modal Markup Fixed**: Eliminated leaked raw HTML text; restored clean 4-dot display with inline error and 3x4 keypad.
            5. **Live Camera Feed in QR Scanner**: Real-time camera viewfinder streaming with laser sweep overlay.
            6. **Gift Catalog Populated**: Top Brands and New Arrivals populated with verified brand vouchers (Apple, Domino's, Amazon, Myntra).
            7. **All Recharge, Utility, and Profile Actions 100% Functional**.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
