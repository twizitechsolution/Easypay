name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Sync Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Add Android Camera & Media Permissions to Manifest
        run: |
          sed -i '/<manifest xmlns:android/a \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' android/app/src/main/AndroidManifest.xml

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-v1.0.18.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.18
          name: "EasyPay Android APK v1.0.18 (Live Vercel Production + Enterprise Admin & Lucky Draw)"
          body: |
            ## EasyPay Mobile Application APK v1.0.18 (Live Vercel Production Release)
            Direct native Android APK connected live to Vercel production server: https://easypay-gamma.vercel.app

            ### Key Features & Updates in v1.0.18:
            1. **Live Vercel Backend Integration**:
               - Configured native app directly with `https://easypay-gamma.vercel.app`.
               - End-to-end live database interaction with Vercel serverless backend.
               - Removed all legacy domains/localhost bindings.
            2. **CRED-Style 3D Animated Lucky Draw System**:
               - Full luxury dark-gold design with 3D animated opening gift box & rotating sunburst rays.
               - Real-time countdown timer to weekly draw.
               - Direct single ₹50 entry pass with balance validation and instant entry confirmation.
               - Dedicated Lucky Draw page with 'My Contests' bottom sheet.
            3. **Enterprise Admin Console**:
               - Full admin portal (`/admin.html`) with Lucky Draw controls (entry fee, prize pool, winner trigger, reset).
               - User management, transactions, investments, and gift cards management.
            4. **E-Commerce & 8 Utility Recharges**:
               - Interactive catalog, cart, animated PIN verification, and instant payment confirmation.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
