name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Copy Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Add Android Camera & Media Permissions to Manifest
        run: |
          sed -i '/<manifest xmlns:android/a \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' android/app/src/main/AndroidManifest.xml

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.13
          name: "EasyPay Android APK v1.0.13 (5 Major Features & Payment Flow Enhancements)"
          body: |
            ## EasyPay Mobile Application APK v1.0.13 (Production Release)
            Full implementation and verification of all 5 UI and feature flows requested by the user:

            ### New Features & Enhancements in v1.0.13:
            1. **Payment Source Selection Sheet (`Pay ₹... from`)**:
               - Opens whenever proceeding with payment (Voucher purchase, Recharge, Transfer, Shopping checkout).
               - Select payment method: EasyPay Wallet / Jio Payments Bank with inline "Check Balance", HDFC Bank, or Bank of India.
               - Includes "Pay Securely ₹..." action button triggering security PIN verification.
            2. **Pay Anyone Search & Transfer Page (`Pay ID / Mobile`)**:
               - Clean top bar with search input for 10-digit mobile number or UPI ID.
               - Pre-populated and searchable contact cards including Twizitech Solution (+91 7013893165, verified badge) and quick Pay CTA.
            3. **Refer & Earn Page**:
               - Added "Refer & Earn" menu option in Profile.
               - Complete milestone cashback rewards (5 tiers: ₹70, ₹70, ₹80, ₹80, ₹100 = ₹400 Cashback).
               - Direct "Refer via Whatsapp" button and native share link with "How It Works" 3-step guide.
            4. **Bank Accounts Management (`Payment Settings` in Profile & `To Bank/Self`)**:
               - Clicking "Payment Settings" opens dedicated Bank Accounts management panel.
               - Displays saved bank details (Bank of India, HDFC Bank) with option to add new bank accounts.
               - "To Bank/Self" on Home page opens saved bank selection for self/bank transfer.
            5. **Inline PIN Success Transition**:
               - Modal no longer abruptly closes upon entering the 4th PIN digit.
               - Smoothly morphs inline into an animated green success screen with checkmark, transaction amount, recipient, ref number, Done and Share Receipt buttons.
               - EasyPay Mall with products and active shopping cart.
               - All 8 recharges and UPI payment touchables operational.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
