name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Copy Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.5
          name: "EasyPay Android APK v1.0.5 (Seamless Splash & OTP Flow)"
          body: |
            ## EasyPay Mobile Application APK v1.0.5 (Seamless Splash & OTP Flow)
            Zero flicker startup, top-level splash screen, and fixed OTP transition loader callback.
            
            ### Fixes & Verification in v1.0.5:
            1. **Zero Flicker Splash Screen First**: Splash screen element moved to the very top of `<body>` with inline `display: flex !important` and `z-index: 999999`. Main home view and bottom navigation are completely hidden by default until user authentication completes.
            2. **Fixed OTP Transition Loader**: Upgraded `openBizLoader` to support callback execution; requesting OTP now shows the authentic orange arc spinner ("Sending OTP to +91...") and seamlessly transitions into the 4-digit OTP entry screen.
            3. **Smooth Verify & Enter Home**: Submitting verified OTP displays "Verifying OTP & Securing Account..." and smoothly navigates into the full EasyPay Home Dashboard.
            4. **All 76 Features Verified**: Gift cards, Bonds 12% investment, UPI bottom-sheet transfers, and Profile settings 100% active.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
