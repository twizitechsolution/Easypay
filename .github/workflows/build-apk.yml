name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Sync Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Add Android Camera & Media Permissions to Manifest
        run: |
          sed -i '/<manifest xmlns:android/a \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' android/app/src/main/AndroidManifest.xml

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-v1.0.26.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.26
          name: "EasyPay Android APK v1.0.26 (Admin Panel Clean-Up: Autofill & Stray Elements Removed, User Details Column & Header Streamlined)"
          body: |
            ## EasyPay Mobile Application APK v1.0.26 (Production Release)
            Direct native Android APK connected live to Vercel production server: https://easypay-gamma.vercel.app

            ### Key Features & Updates in v1.0.26:
            1. **Admin Login Page Refinements**:
               - Removed the 'Quick Demo Access' auto-fill credentials chip completely.
               - Renamed title to 'EasyPay Admin Login' for clean, production-grade presentation.
            2. **Bottom-of-Page Visual Clean-Up**:
               - Eliminated the stray `========================================== -->` comment artifact completely.
            3. **Active User Investments Ledger - User Details Column**:
               - Replaced the 'Certificate ID / Folio' column with 'User Details'.
               - Displays User Mobile Number at the top and unique User ID (`EPY...`) directly below it.
               - Guaranteed unique User ID generation upon account registration.
            4. **Streamlined Header Navigation**:
               - Cleaned up top header bar across all admin views by removing 'User Super App', 'Add Plan', and 'Sync Database' buttons.
            5. **Universal Real-Time Wallet Balance Deduction & Real-Time Sync**:
               - Wallet balance deductions, double-entry audit records, and Passbook history fully synced in real-time across database and admin dashboard.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
