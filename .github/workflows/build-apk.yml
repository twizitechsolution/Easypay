name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Copy Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.9
          name: "EasyPay Android APK v1.0.9 (Fixed Menu Button, Restored Bottom Nav & All Tab Routing)"
          body: |
            ## EasyPay Mobile Application APK v1.0.9 (Root Cause Resolution & Permanent Fix)
            Production release completely resolving the missing menu bar, top header alignment, gift cards routing, and home page touchable interactions.
            
            ### Root Cause & Permanent Fixes in v1.0.9:
            1. **Restored Bottom Navigation Bar**: Removed conflicting inline `display: none` from `#appBottomNav` and ensured bottom navigation stays permanently visible across the app.
            2. **Top Header Alignment & Hamburger Menu**: Restored the hamburger menu icon (`fa-bars`) and side drawer menu, perfectly centering the EasyPay logo, search, bell notification dot, and avatar.
            3. **Gift Vouchers Routing (Zero White Screen)**: Standardized all tab alias triggers (`giftCard`, `giftcards`, `gifts`, `shopping`) inside `switchNavTab` so the Gift Vouchers catalog opens instantly without blank white screens.
            4. **Home Interactive Modals Wired**:
               - Send Money (`openSendMoneyModal` -> `p2pPaymentModal`)
               - Check Balance (`openBalanceModal` -> `checkBalanceModal`)
               - Transfer to Bank (`openToBankModal` -> `transferToBankModal`)
               - Recharges & Utilities (`openRechargeModal` -> `rechargeModal`)
               - My Bills (`openMyBillsModal` -> `myBillsModal`)
               - My QR & Scanner modals fully interactive.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
