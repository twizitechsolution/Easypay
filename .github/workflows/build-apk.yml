name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Copy Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.8
          name: "EasyPay Android APK v1.0.8 (Home Cards Interactivity, Invest Transition, Web Audio Chime & Passbook)"
          body: |
            ## EasyPay Mobile Application APK v1.0.8 (Comprehensive Directive Enhancements)
            Production release with complete interactive Home Page service cards, authentic Bottom Nav with animated Invest center button, Web Audio payment success chime, Passbook All Transactions fix, and scaled-down Gift Card checkout.
            
            ### Fixes & Enhancements in v1.0.8:
            1. **Home Page & Section Interactions**:
               - All interactive touchables wired: Check Balance, Transfer to Bank/Self, Pay ID/Mobile, Recharges & Utility Bills, and My Bills.
            2. **Bottom Navigation Bar Redesign**:
               - Four tabs in exact order: Home, Invest (center elevated button with 12% badge), Shopping, and Profile.
               - Active tab state applies active orange color (`#FF5722`) to both icon and label simultaneously.
            3. **Invest Page Introductory Animation**:
               - Restored pre-transition radar connecting animation sequence (pulse ripples, DICGC insurance banner, and user/bank badges) before opening the Bonds & Fixed Deposits dashboard.
            4. **My Profile & Passbook Enhancements**:
               - Bank accounts management modal and PIN settings fully interactive.
               - Passbook "All Transactions" view fixed to load and render the complete transaction history ledger dynamically.
            5. **Gift Card Checkout, Inline PIN Error & Web Audio Chime**:
               - Sizing and padding scaled down to eliminate screen overflow clipping.
               - Inline "Wrong PIN" error inside PIN modal without abrupt dismissal.
               - Authentic Web Audio payment success chime (C5-E5-G5 harmonic chord) on correct PIN validation.
               - Fullscreen Success Modal with green check badge, UTR, Voucher Code, PIN, and Passbook logging.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
