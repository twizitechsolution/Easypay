name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Sync Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Add Android Camera & Media Permissions to Manifest
        run: |
          sed -i '/<manifest xmlns:android/a \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' android/app/src/main/AndroidManifest.xml

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-v1.0.19.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.19
          name: "EasyPay Android APK v1.0.19 (SMS Gateway Integration, Sign Up Page & Home Announcement Pop-up)"
          body: |
            ## EasyPay Mobile Application APK v1.0.19 (Production Release)
            Direct native Android APK connected live to Vercel production server: https://easypay-gamma.vercel.app

            ### Key Features & Updates in v1.0.19:
            1. **HSPSMS Transactional SMS Gateway Integration**:
               - Integrated real-time SMS OTP dispatch via http://sms.hspsms.com/sendSMS.
               - Support for Login OTP and Registration OTP verification with 10-minute expiry.
               - Full validation and fallback tolerance for testing and DLT header configuration.
            2. **Authentic Modern Sign Up Screen (Attachment 2 Design)**:
               - Orange curved gradient header with back navigation and security shield badge.
               - Rounded pill form inputs for Name, Email, Password (with eye toggle), Mobile Number (+91), Referral Code, State dropdown, City, and 4-digit MPIN.
               - 18+ confirmation checkbox and instant transition to SMS OTP verification.
               - Automatic account creation with ₹100 Welcome Bonus and referral bonuses.
            3. **Home Screen Announcement Pop-up (Attachment 1 Design)**:
               - Fullscreen blurred modal automatically displayed on Home dashboard load.
               - Floating circular black ✕ close button on top-right.
               - Displays Grand Trip program announcement flyer.
            4. **Enterprise Admin Console Announcement & SMS Manager**:
               - Admin portal tab for controlling the Home Screen Announcement flyer (toggle on/off, URL input, file upload, fullscreen preview).
               - Real-time SMS Gateway settings management and live diagnostic test SMS dispatch console.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
