name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Sync Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Add Android Camera & Media Permissions to Manifest
        run: |
          sed -i '/<manifest xmlns:android/a \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' android/app/src/main/AndroidManifest.xml

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-v1.0.28.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.28
          name: "EasyPay Android APK v1.0.28 (Gift Cards Visual Refresh, Dynamic Profile ID, PIN Reset Flow & Full Mall Checkout System)"
          body: |
            ## EasyPay Mobile Application APK v1.0.28 (Production Release)
            Direct native Android APK connected live to Vercel production server: https://easypay-gamma.vercel.app

            ### Key Features & Updates in v1.0.28:
            1. **Gift Cards Logo Presentation Visual Refresh**:
               - Removed the black/dark borders and background boxes around brand logos.
               - Logos are cleanly rounded on white tiles with subtle border and shadow, preserving official brand aesthetics.
            2. **Account / Profile Section Redesign**:
               - Structured strictly: **Name -> Mobile Number -> User ID** (e.g. `arman khan` -> `+91 7013893165` -> `User ID: EPY31650`).
               - Removed eye and copy icons next to User ID.
               - Removed warning icon from the Profile button.
               - 'Payment Settings' updated with right-aligned chevron and subtitle 'Add and manage bank accounts' (removed saved cards and KYC).
            3. **Dedicated Set / Reset Security PIN Page**:
               - Fully functional dedicated slide-in view (`#viewResetPin`) to verify registered mobile via 4-digit OTP and set/update 4-digit security PIN.
               - Synced with backend `POST /api/user/set-pin`.
            4. **Dedicated My Orders & Shipment Tracking Timeline**:
               - Replaced UPI Requests with **My Orders** (`#viewMyOrders`) supporting Mall Orders and Gift Vouchers tabs.
               - Amazon/Flipkart-style 5-stage shipment tracking timeline modal with courier details and AWB tracking numbers.
            5. **EasyPay Mall Real-Time Cart & Checkout System**:
               - Real-time cart count badge `#shopCartCountBadge` in header.
               - Coupon Code section placed above Delivery Charges supporting `EASYPAY50`, `WELCOME100`, and `BACHAT20`.
               - Dedicated Checkout modal with Delivery Address form, Order Summary, and Payment Options (EasyPay Wallet, UPI, COD).
               - Real-time wallet deduction via `/api/wallet/transact` and database sync via `POST /api/orders/create`.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
