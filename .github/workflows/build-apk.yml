name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Sync Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Add Android Camera & Media Permissions to Manifest
        run: |
          sed -i '/<manifest xmlns:android/a \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' android/app/src/main/AndroidManifest.xml

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-v1.0.25.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.25
          name: "EasyPay Android APK v1.0.25 (Universal Real-Time Wallet Balance Deduction, Audit Ledger & Admin Panel Database Sync)"
          body: |
            ## EasyPay Mobile Application APK v1.0.25 (Production Release)
            Direct native Android APK connected live to Vercel production server: https://easypay-gamma.vercel.app

            ### Key Features & Updates in v1.0.25:
            1. **Universal Real-Time Wallet Balance Deduction**:
               - Every transaction across all services (Money Transfer / P2P, Mobile / DTH Recharge, Gift Card Purchase, Shopping / Mall Order Checkout) automatically deducts the exact amount from the user's wallet in real-time.
               - Wallet balance is synchronized in `server/db.json` across both `data.user` and the matching user record in `data.users`.
            2. **Permanent Database Transaction Records**:
               - Every transaction generates a certified audit record in `data.transactions` in the database with a unique UTR (`EPY...`), category, timestamp, formatted date, and status.
            3. **Real-Time Passbook & History Reflection**:
               - Transactions immediately appear in the user's Passbook / Transaction History view with correct debit/credit indicators, category badges, and UTR details.
            4. **Admin Panel Real-Time Sync**:
               - The Enterprise Admin Panel (`/admin`) reflects live wallet balances, updated platform GMV, new vouchers, and real-time transaction ledger with automatic background synchronization.
            5. **100% Dynamic Payment Success Modal & Session Persistence**:
               - Displays exact dynamic payment amounts, purpose/brand, unique UTR, and instant voucher card with PIN and copy capability.
               - Preserves login sessions permanently across app restarts.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
