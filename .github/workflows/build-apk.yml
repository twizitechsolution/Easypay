name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Copy Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "EasyPay Android APK v1.0.0 (Production Release)"
          body: |
            ## EasyPay Mobile Application APK
            Official Production Release APK for EasyPay Enterprise Financial Platform.
            
            ### Included Features:
            - **Authentic Flame Splash Screen** with smooth typewriter animation.
            - **Mobile Login & 4-digit OTP Verification Flow**.
            - **Mobile Recharge & Bill Payments** with instant plan search filter.
            - **High Yield Bonds (12%)** with live connecting radar animation.
            - **Official Brand Gift Cards** with instant auto-discount & dynamic payment buttons.
            - **Profile & Security PIN Setup** with registered mobile OTP authentication.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
