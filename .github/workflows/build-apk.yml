name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Sync Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Add Android Camera & Media Permissions to Manifest
        run: |
          sed -i '/<manifest xmlns:android/a \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' android/app/src/main/AndroidManifest.xml

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-v1.0.23.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.23
          name: "EasyPay Android APK v1.0.23 (Hubble Money 380+ Gift Cards Integration & Live Voucher Issuance)"
          body: |
            ## EasyPay Mobile Application APK v1.0.23 (Production Release)
            Direct native Android APK connected live to Vercel production server: https://easypay-gamma.vercel.app

            ### Key Features & Updates in v1.0.23:
            1. **Hubble Money Gift Cards API Integration (Staging)**:
               - Integrated with Hubble Money Staging API (`api.dev.myhubble.money`) with Client ID & Secret credentials.
               - Full active catalog of 387+ top Indian brands (Flipkart, Amazon Shopping, Zomato, Swiggy, Apollo Pharmacy, Reliance Digital, IKEA, Myntra, etc.) with official CDN logos.
               - Real-time voucher issuance with 16-digit card code, secure PIN, expiry date, and verified redemption instructions.
            2. **End-to-End Voucher Purchase & Wallet Deduction**:
               - Real-time instant Bachat discount calculation (up to 8-16% savings).
               - Seamless wallet debit and ledger transaction recording.
               - Copy voucher code and PIN with 1 tap.
               - Gift Vouchers History view with all purchased cards.
            3. **Production Clean OTP Screen & Live DLT SMS**:
               - Clean OTP input screen with empty boxes and strict verification.
               - Live SMS delivery via DLT header `AFTTRD`.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
