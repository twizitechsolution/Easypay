name: Build EasyPay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Copy Assets
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyPay-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.7
          name: "EasyPay Android APK v1.0.7 (Authentic Freecharge Biz UI & Complete Flow Verification)"
          body: |
            ## EasyPay Mobile Application APK v1.0.7 (Authentic Freecharge Biz UI & Complete Flow Verification)
            Production release with authentic Freecharge Biz bottom navigation, full Security PIN payment integration for Gift Vouchers and Transfers, dynamic My QR rendering, and zero-freeze robust API routing.
            
            ### Fixes & Enhancements in v1.0.7:
            1. **Authentic Freecharge Biz Bottom Nav**: Exactly matching the reference UI with Home on the left, an elevated circular orange QR Scan button in the center with immediate scanner launch, and Loans & Invest on the right.
            2. **Interactive 4-Digit Security PIN Modal for Gift Card Checkout & Transfers**:
               - Gift Voucher "Proceed To Pay" immediately prompts for the authentic 4-digit Security PIN keypad (default: `1234`).
               - Validating PIN securely authorizes purchase, deducts wallet balance, updates passbook, and displays the gift voucher with code, PIN, and expiry date.
               - P2P UPI transfers use the same PIN modal with real-time feedback and instant fallback handling.
            3. **My QR Code Instant Rendering Fixed**: Corrected modal element bindings and implemented crisp inline SVG QR generation fallback so merchant QR codes render immediately without blank white areas.
            4. **Mobile API Route & Fallback Stability**: All relative endpoints updated with `API_BASE` and resilient local offline fallbacks, preventing Capacitor WebView connection drops.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
